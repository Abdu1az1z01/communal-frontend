<div class="backdrop" (click)="closed.emit()">
  <form class="card modal" (click)="$event.stopPropagation()" (ngSubmit)="save()">
    <h3>{{ isEdit ? 'Редактировать абонента' : 'Новый абонент' }}</h3>
    <div class="muted">{{ service().icon }} {{ service().name }}</div>

    <label>
      ФИО *
      <input class="input" name="ownerName" [(ngModel)]="form.ownerName" placeholder="Фамилия Имя Отчество" />
    </label>

    <div class="row-2">
      <label>
        Лицевой счёт *
        <input class="input" name="accountNumber" [(ngModel)]="form.accountNumber" placeholder="102030" />
      </label>
      <label>
        Тариф, сом/{{ service().unit }} *
        <input class="input" name="tariff" type="number" step="0.01" min="0" [(ngModel)]="form.tariff" />
      </label>
    </div>

    <label>
      Телефон
      <input class="input" name="phone" [(ngModel)]="form.phone" placeholder="+996 555 123456" />
    </label>

    <label>
      Адрес
      <input class="input" name="address" [(ngModel)]="form.address" placeholder="г. Бишкек, ул. ..., кв. ..." />
    </label>

    @if (!isEdit) {
      <label>
        Начальные показания счётчика
        <input class="input" name="currentReading" type="number" min="0" [(ngModel)]="form.currentReading" />
      </label>
    }

    @if (error()) {
      <p class="msg msg-error">⚠️ {{ error() }}</p>
    }

    <div class="actions">
      <button type="button" class="btn btn-secondary" (click)="closed.emit()">Отмена</button>
      <button type="submit" class="btn btn-primary" [disabled]="isSaving()">
        {{ isSaving() ? 'Сохранение...' : 'Сохранить' }}
      </button>
    </div>
  </form>
</div>
