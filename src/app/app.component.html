<div class="app">

  <!-- Шапка Zetta Billing: название в левом верхнем углу -->
  <header class="topbar">
    <a class="brand-title" routerLink="/">Zetta <span>Billing</span></a>
    <span class="version">v1.0</span>
  </header>

  <!-- Коммунальные услуги: всегда видны слева под названием (список — в services.ts) -->
  <nav class="sidebar">
    <div class="menu-title">Коммунальные услуги</div>
    @for (service of services; track service.id) {
      <a class="menu-item" [routerLink]="['/services', service.id]" routerLinkActive="active">
        <span class="menu-icon">{{ service.icon }}</span>
        {{ service.name }}
      </a>
    }
  </nav>

  <!-- Сюда подставляется текущая страница (см. app.routes.ts) -->
  <main class="content">
    <router-outlet />
  </main>
</div>
