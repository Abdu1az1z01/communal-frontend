<div class="app" [class.no-sidebar]="!auth.isLoggedIn()">

  <!-- Шапка Zetta Billing: логотип и название в левом верхнем углу, справа — кто вошёл и кнопка «Выйти» -->
  <header class="topbar">
    <a class="brand" routerLink="/">
      <img class="brand-logo" src="logo.png" alt="" />
      <span class="brand-title">Zetta <span>Billing</span></span>
    </a>

    <div class="user">
      @if (auth.session(); as s) {
        <div class="user-info">
          <div class="user-name">{{ s.name }}</div>
          <div class="user-role">🏛️ Муниципальная инспекция</div>
        </div>
        <button type="button" class="logout" (click)="logout()">Выйти</button>
      }
      <span class="version">v1.0</span>
    </div>
  </header>

  <!-- Коммунальные услуги: меню слева после входа (список — в services.ts) -->
  @if (auth.isLoggedIn()) {
    <nav class="sidebar">
      <div class="menu-title">Коммунальные услуги</div>
      @for (service of services; track service.id) {
        <a class="menu-item" [routerLink]="['/services', service.id]" routerLinkActive="active">
          <span class="menu-icon">{{ service.icon }}</span>
          {{ service.name }}
        </a>
      }
    </nav>
  }

  <!-- Сюда подставляется текущая страница (см. app.routes.ts) -->
  <main class="content">
    <router-outlet />
  </main>
</div>
